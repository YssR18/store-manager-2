<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة المحل</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e293b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    body.dark-mode {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 75px; }

    /* Top Bar */
    .app-bar {
      background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; sticky; top:0; z-index: 100;
    }
    .app-bar h1 { font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    /* Bottom Mobile Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000;
    }
    .nav-item { color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.72rem; font-weight: 700; gap: 3px; }
    .nav-item.active { color: var(--primary); }
    .nav-item i { font-size: 1.2rem; }

    .container { padding: 12px; }

    /* Mobile Cards */
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

    /* Interactive List */
    .list-item {
      background: var(--card); border-radius: 10px; border: 1px solid var(--border);
      padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }

    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 10px; text-align: right; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; }

    .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--card); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }

    #toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0f172a; color: white; padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; z-index: 3000; transition: transform 0.3s; }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="app-bar">
    <h1><i class="fa-solid fa-store"></i> <span id="appShopTitle">إدارة المحل</span></h1>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-outline btn-sm" onclick="syncCloud()"><i class="fa-solid fa-rotate"></i></button>
      <button class="btn btn-outline btn-sm" onclick="toggleDarkMode()"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <div class="container">

    <!-- TAB 1: POS (نقطة البيع) -->
    <section id="sec-pos" class="page-sec">
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="posSearch" placeholder="🔍 بحث أو باركود..." oninput="renderPOS()" style="flex:1; padding:9px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text)">
        <button class="btn btn-primary btn-sm" onclick="startCameraScanner()"><i class="fa-solid fa-camera"></i> الكاميرا</button>
      </div>

      <div id="posList"></div>
    </section>

    <!-- TAB 2: المخزون والسلع -->
    <section id="sec-stock" class="page-sec" style="display:none;">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <button class="btn btn-primary btn-sm" onclick="openModal('addGoodModal')"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
        <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
      </div>
      <div id="stockList"></div>
    </section>

    <!-- TAB 3: التقارير والحركات اليومية -->
    <section id="sec-reports" class="page-sec" style="display:none;">
      <div class="stats-grid">
        <div class="card" style="margin:0">
          <small style="color:var(--text-muted)">مبيعات اليوم</small>
          <h3 id="todaySalesVal" style="color:var(--primary)">0 د.ج</h3>
        </div>
        <div class="card" style="margin:0">
          <small style="color:var(--text-muted)">أرباح اليوم</small>
          <h3 id="todayProfitVal" style="color:var(--success)">0 د.ج</h3>
        </div>
      </div>

      <h4 style="margin:12px 0 8px 0; font-size:0.95rem;">السجل اليومي للمبيعات:</h4>
      <div id="dailySalesHistory"></div>
    </section>

    <!-- TAB 4: الإعدادات -->
    <section id="sec-settings" class="page-sec" style="display:none;">
      <div class="card">
        <h3 style="margin-bottom:12px; font-size:1rem;"><i class="fa-solid fa-gear"></i> الربط والإعدادات</h3>
        <div class="form-group">
          <label>اسم المحل:</label>
          <input type="text" id="shopNameInput" value="محلي">
        </div>
        <div class="form-group">
          <label>رابط Google Apps Script API:</label>
          <input type="text" id="apiUrlInput" placeholder="ضع الرابط هنا">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="saveSettings()">حفظ وتزامن</button>
      </div>
    </section>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active" onclick="switchTab('pos', this)"><i class="fa-solid fa-cash-register"></i><span>البيع</span></a>
    <a href="#" class="nav-item" onclick="switchTab('stock', this)"><i class="fa-solid fa-boxes-stacked"></i><span>المخزون</span></a>
    <a href="#" class="nav-item" onclick="switchTab('reports', this)"><i class="fa-solid fa-chart-line"></i><span>التقارير</span></a>
    <a href="#" class="nav-item" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
  </nav>

  <!-- Modals -->
  <!-- 📷 نافذة كاميرا الباركود -->
  <div class="modal" id="cameraModal">
    <div class="modal-content" style="text-align:center;">
      <h3 style="margin-bottom:10px;"><i class="fa-solid fa-camera"></i> مسح الباركود</h3>
      <div id="cameraReader" style="width:100%;"></div>
      <button class="btn btn-outline" style="margin-top:12px; width:100%;" onclick="stopCameraScanner()">إلغاء</button>
    </div>
  </div>

  <!-- ➕ إضافة منتج مع مولد باركود -->
  <div class="modal" id="addGoodModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">إضافة سلعة جديدة</h3>
      <div class="form-group"><label>اسم السلعة</label><input type="text" id="mName"></div>
      <div class="form-group"><label>الفئة</label><input type="text" id="mCategory" value="عام"></div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1"><label>سعر الشراء</label><input type="number" id="mBuyPrice"></div>
        <div class="form-group" style="flex:1"><label>سعر البيع</label><input type="number" id="mSellPrice"></div>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1"><label>كمية المحل</label><input type="number" id="mShopQty" value="0"></div>
        <div class="form-group" style="flex:1"><label>كمية المخزن</label><input type="number" id="mStoreQty" value="0"></div>
      </div>
      <div class="form-group">
        <label>الباركود</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="mBarcode">
          <button class="btn btn-outline btn-sm" onclick="generateBarcode()">توليد</button>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-primary" style="flex:1" onclick="saveProduct()">حفظ السلعة</button>
        <button class="btn btn-outline" onclick="closeModal('addGoodModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- ✏️ تعديل ونقل كمية -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">إدارة المنتج والتعديل</h3>
      <input type="hidden" id="editId">
      <div class="form-group"><label>اسم السلعة</label><input type="text" id="editName"></div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1"><label>كمية المحل</label><input type="number" id="editShopQty"></div>
        <div class="form-group" style="flex:1"><label>كمية المخزن</label><input type="number" id="editStoreQty"></div>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-primary" style="flex:1" onclick="saveEdit()">حفظ التعديل</button>
        <button class="btn btn-danger" onclick="deleteProd()">حذف</button>
      </div>
      <button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="closeModal('editModal')">إغلاق</button>
    </div>
  </div>

  <div id="toast">تمت العملية بنجاح</div>

  <script>
    let db = { inventory: [], movements: [] };
    let html5QrcodeScanner = null;

    window.onload = function() {
      const local = localStorage.getItem('app_data_v2');
      if (local) db = JSON.parse(local);
      loadSettings();
      renderAll();
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    function switchTab(tabId, elem) {
      document.querySelectorAll('.page-sec').forEach(s => s.style.display = 'none');
      document.getElementById('sec-' + tabId).style.display = 'block';
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      elem.classList.add('active');
    }

    function saveLocal() {
      localStorage.setItem('app_data_v2', JSON.stringify(db));
      renderAll();
    }

    function renderAll() {
      renderPOS();
      renderStock();
      renderReports();
    }

    function renderPOS() {
      const query = document.getElementById('posSearch').value.toLowerCase();
      const container = document.getElementById('posList');
      const filtered = db.inventory.filter(p => p.name.toLowerCase().includes(query) || (p.barcode && p.barcode.includes(query)));

      container.innerHTML = filtered.map(p => `
        <div class="list-item">
          <div>
            <div style="font-weight:700;">${p.name}</div>
            <small style="color:var(--text-muted)">المحل: ${p.shopQty} | المخزن: ${p.storeQty}</small>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <b style="color:var(--primary);">${p.sellPrice} د.ج</b>
            <button class="btn btn-success btn-sm" onclick="makeSale('${p.id}')" ${p.shopQty <= 0 ? 'disabled style="opacity:0.4"' : ''}>بيع</button>
          </div>
        </div>
      `).join('');
    }

    function makeSale(id) {
      let p = db.inventory.find(item => item.id === id);
      if (p && p.shopQty > 0) {
        p.shopQty--;
        const now = new Date();
        db.movements.unshift({
          id: Date.now().toString(),
          date: now.toISOString().split('T')[0],
          time: now.toTimeString().split(' ')[0].substring(0, 5),
          productName: p.name,
          type: "بيع قطعة",
          qty: 1,
          balanceAfter: p.shopQty + p.storeQty,
          buyPrice: p.buyPrice,
          sellPrice: p.sellPrice,
          reason: "بيع من نقطة البيع",
          user: "المدير"
        });
        saveLocal();
        showToast(`تم بيع 1x (${p.name})`);
      }
    }

    function renderStock() {
      const container = document.getElementById('stockList');
      container.innerHTML = db.inventory.map(p => {
        const tot = p.shopQty + p.storeQty;
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b>${p.name}</b>
              <span class="badge ${tot <= 3 ? 'badge-danger' : 'badge-success'}">${tot <= 3 ? 'منخفض' : 'متوفر'}</span>
            </div>
            <div style="margin:8px 0; font-size:0.85rem; color:var(--text-muted);">
              المحل: <b>${p.shopQty}</b> | المخزن: <b>${p.storeQty}</b> | الشراء: ${p.buyPrice} | البيع: ${p.sellPrice}
            </div>
            <button class="btn btn-outline btn-sm" style="width:100%" onclick="openEdit('${p.id}')">تعديل ونقل الكمية</button>
          </div>
        `;
      }).join('');
    }

    function generateBarcode() {
      document.getElementById('mBarcode').value = '84' + Math.floor(1000000 + Math.random() * 9000000);
    }

    function saveProduct() {
      const name = document.getElementById('mName').value.trim();
      if (!name) return alert('اسم السلعة مطلوب');

      db.inventory.push({
        id: 'P-' + Date.now().toString().slice(-5),
        name: name,
        category: document.getElementById('mCategory').value,
        buyPrice: parseFloat(document.getElementById('mBuyPrice').value) || 0,
        sellPrice: parseFloat(document.getElementById('mSellPrice').value) || 0,
        shopQty: parseInt(document.getElementById('mShopQty').value) || 0,
        storeQty: parseInt(document.getElementById('mStoreQty').value) || 0,
        minQty: 3,
        barcode: document.getElementById('mBarcode').value
      });

      saveLocal();
      closeModal('addGoodModal');
      showToast('تمت إضافة المنتج');
    }

    function openEdit(id) {
      let p = db.inventory.find(item => item.id === id);
      if (p) {
        document.getElementById('editId').value = p.id;
        document.getElementById('editName').value = p.name;
        document.getElementById('editShopQty').value = p.shopQty;
        document.getElementById('editStoreQty').value = p.storeQty;
        openModal('editModal');
      }
    }

    function saveEdit() {
      let id = document.getElementById('editId').value;
      let p = db.inventory.find(item => item.id === id);
      if (p) {
        p.name = document.getElementById('editName').value;
        p.shopQty = parseInt(document.getElementById('editShopQty').value) || 0;
        p.storeQty = parseInt(document.getElementById('editStoreQty').value) || 0;
        saveLocal();
        closeModal('editModal');
        showToast('تم التعديل بنجاح');
      }
    }

    function deleteProd() {
      if (confirm('هل تريد الحذف؟')) {
        let id = document.getElementById('editId').value;
        db.inventory = db.inventory.filter(i => i.id !== id);
        saveLocal();
        closeModal('editModal');
        showToast('تم الحذف');
      }
    }

    function startCameraScanner() {
      openModal('cameraModal');
      html5QrcodeScanner = new Html5QrcodeScanner("cameraReader", { fps: 10, qrbox: 220 });
      html5QrcodeScanner.render((text) => {
        document.getElementById('posSearch').value = text;
        renderPOS();
        stopCameraScanner();
        showToast("باركود: " + text);
      });
    }

    function stopCameraScanner() {
      if (html5QrcodeScanner) html5QrcodeScanner.clear();
      closeModal('cameraModal');
    }

    function renderReports() {
      const today = new Date().toISOString().split('T')[0];
      let salesSum = 0, profitSum = 0;

      const salesToday = db.movements.filter(m => m.date === today && m.type === "بيع قطعة");
      salesToday.forEach(s => {
        salesSum += s.sellPrice;
        profitSum += (s.sellPrice - s.buyPrice);
      });

      document.getElementById('todaySalesVal').innerText = salesSum + ' د.ج';
      document.getElementById('todayProfitVal').innerText = profitSum + ' د.ج';

      document.getElementById('dailySalesHistory').innerHTML = salesToday.map(s => `
        <div class="list-item">
          <div><b>${s.productName}</b><br><small style="color:var(--text-muted);">${s.time}</small></div>
          <b style="color:var(--success)">+${s.sellPrice} د.ج</b>
        </div>
      `).join('');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveSettings() {
      localStorage.setItem('app_shop_title', document.getElementById('shopNameInput').value);
      localStorage.setItem('app_api_url', document.getElementById('apiUrlInput').value);
      showToast('تم الحفظ');
      syncCloud();
    }

    function loadSettings() {
      const url = localStorage.getItem('app_api_url');
      if (url) document.getElementById('apiUrlInput').value = url;
      const title = localStorage.getItem('app_shop_title');
      if (title) document.getElementById('appShopTitle').innerText = title;
    }

    // المزامنة السحابية المصححة لتفادي حظر CORS
    async function syncCloud() {
      const url = localStorage.getItem('app_api_url');
      if (!url) return showToast('ادخل رابط الـ API أولاً');
      showToast('جاري المزامنة... 🔄');

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "SYNC_ALL", ...db })
        });
        showToast('تم حفظ البيانات في الشيت 🟢');
      } catch (e) {
        showToast('خطأ أثناء المزامنة');
      }
    }
  </script>
</body>
</html>
